<title>ArcRight</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Big+Shoulders+Stencil:wght@900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen shop app. Top bar, tool rail, cutting-table canvas, inspector on the right. Stacks on phones. */
:root{
  --bg:#E6EAED; --panel:#F6F8F9; --sheet:#FBFCFC; --ink:#17202A; --muted:#566573; --line:#C9D1D8;
  --grid:#E7EBEE; --grid-major:#CCD4DA; --field:#FFFFFF;
  --cut-out:#D9530B; --cut-in:#1764BD; --warn:#C42727; --ok:#2A7F3C; --accent:#D9530B; --accent-ink:#FFFFFF;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-stencil:"Big Shoulders Stencil","Arial Narrow",Impact,sans-serif;
  --plate:#1B232B;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11161B; --panel:#182027; --sheet:#0C1115; --ink:#E3E8EC; --muted:#8E9BA6; --line:#2A343D;
  --grid:#151C22; --grid-major:#232D35; --field:#0F151A;
  --cut-out:#FF8A3D; --cut-in:#5AACF5; --warn:#FF6B6B; --ok:#5FC777; --accent:#FF8A3D; --accent-ink:#1A0D04; --plate:#C9D1D8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11161B; --panel:#182027; --sheet:#0C1115; --ink:#E3E8EC; --muted:#8E9BA6; --line:#2A343D;
  --grid:#151C22; --grid-major:#232D35; --field:#0F151A;
  --cut-out:#FF8A3D; --cut-in:#5AACF5; --warn:#FF6B6B; --ok:#5FC777; --accent:#FF8A3D; --accent-ink:#1A0D04; --plate:#C9D1D8; color-scheme:dark}

[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}

button,.btn{font:500 13px/1 var(--f-body);color:var(--ink);background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.primary:hover{filter:brightness(1.06);border-color:var(--accent)}
input,select{font:400 13px var(--f-mono);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:6px 8px;min-width:0}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:8px;margin-right:6px}
/* logo: the cut-plate sign, stencil letters on a bolted steel plate */
.plate{position:relative;display:inline-block;background:var(--plate);color:var(--bg);border-radius:6px;padding:7px 20px 6px;
  font:900 28px/1 var(--f-stencil);letter-spacing:.02em}
.plate b{color:var(--accent);font-weight:900}
.plate i{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--bg)}
.plate i:nth-child(1){left:6px;top:6px}.plate i:nth-child(2){right:6px;top:6px}
.plate i:nth-child(3){left:6px;bottom:6px}.plate i:nth-child(4){right:6px;bottom:6px}
.group{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.push{margin-left:auto}
.name-field{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:6px;background:var(--field);overflow:hidden}
.name-field span{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 8px}
.name-field input{border:0;border-radius:0;width:9.5em;padding:8px 2px}
.name-field em{font:400 13px var(--f-mono);color:var(--muted);font-style:normal;padding-right:8px}

/* work area */
.work{display:grid;grid-template-columns:52px minmax(0,1fr) 300px;gap:10px;min-height:0}
.rail{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px}
.tool{width:40px;height:40px;padding:0;justify-content:center;position:relative;border-color:transparent;background:transparent}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tool kbd{position:absolute;right:3px;bottom:2px;font:500 9px var(--f-mono);color:var(--muted)}
.tool[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.tool[aria-pressed=true] kbd{color:var(--panel);opacity:.7}
.rail hr{border:0;border-top:1px solid var(--line);margin:4px 2px;width:auto}

.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet);touch-action:none}
.stage canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;bottom:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;pointer-events:none}
.readout{font:500 12px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);background:color-mix(in srgb,var(--panel) 88%,transparent);
  border:1px solid var(--line);border-radius:5px;padding:5px 8px}
.zoom{display:flex;gap:4px;pointer-events:auto}
.zoom button{padding:6px 9px;font-family:var(--f-mono)}
.hint{position:absolute;left:10px;top:10px;right:10px;font:500 12px var(--f-body);color:var(--muted);pointer-events:none}
.hint:empty{display:none}
.hint span{background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:5px;padding:5px 8px;display:inline-block}
.drop{position:absolute;inset:0;display:grid;pointer-events:none;place-items:center;background:color-mix(in srgb,var(--accent) 12%,transparent);
  border:2px dashed var(--accent);border-radius:8px;font:600 22px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}

/* inspector */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;min-height:0;display:flex;flex-direction:column}
.sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;font:600 15px/1 var(--f-display);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.size{font:600 30px/1 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.size small{font:500 13px var(--f-mono);color:var(--muted);margin-left:4px}
.layers{display:flex;flex-direction:column;gap:6px}
.layer{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:13px}
.sw{width:14px;height:3px;border-radius:2px}
.layer b{font:500 13px var(--f-mono)}
.layer .n{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;font-size:13px;line-height:1.35}
.checks li button{all:unset;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px}
.checks li button:focus-visible{outline:2px solid var(--accent)}
.pill{font:600 10px/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:4px 6px;border-radius:4px;margin-top:1px}
.pill.warn{color:var(--warn);border:1px solid var(--warn)}
.pill.ok{color:var(--ok);border:1px solid var(--ok)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.field.full{grid-column:1/-1}
.unit{position:relative;display:flex}
.unit input{width:100%;padding-right:26px}
.unit i{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:400 12px var(--f-mono);color:var(--muted);font-style:normal;pointer-events:none}
.actions{display:flex;flex-wrap:wrap;gap:6px}
.offset-box{display:flex;flex-direction:column;gap:10px;margin-top:12px;padding:12px;border:1px dashed var(--accent);border-radius:6px}
.actions button{padding:7px 9px;font-size:12px}
.muted{color:var(--muted);font-size:13px;line-height:1.45;margin:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.row select{max-width:9.5em}
.keys{font:400 12px/1.7 var(--f-body);color:var(--muted);margin:0}
.keys kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:3px;padding:0 4px;background:var(--field);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);
  font:500 13px var(--f-body);padding:10px 14px;border-radius:6px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:20}

@media (max-width:860px){
  html,body,.app{height:auto}
  .work{grid-template-columns:1fr;grid-template-rows:auto 62vh auto}
  .rail{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .rail hr{border-top:0;border-left:1px solid var(--line);margin:2px 4px}
  .push{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">
      <span class="plate" role="img" aria-label="ArcRight"><i></i><i></i><i></i><i></i>ARC<b>RIGHT</b></span>
    </div>
    <div class="group">
      <button id="btn-new" type="button">New</button>
      <label class="btn" for="file-in" tabindex="0" id="lbl-import">Import SVG</label>
      <input type="file" id="file-in" accept=".svg,image/svg+xml" hidden>
      <button id="btn-undo" type="button" title="Undo (Ctrl+Z)">Undo</button>
      <button id="btn-redo" type="button" title="Redo (Ctrl+Shift+Z)">Redo</button>
    </div>
    <div class="group push">
      <label class="name-field"><span>Part</span><input id="part-name" spellcheck="false" autocomplete="off"><em>.dxf</em></label>
      <button id="btn-copy" type="button" title="Copy the DXF text to the clipboard">Copy DXF</button>
      <button id="btn-dl" type="button" class="primary">Download DXF</button>
    </div>
  </header>

  <div class="work">
    <nav class="rail" aria-label="Drawing tools">
      <button class="tool" data-tool="select" title="Select and move (V)" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.6L10 19z"/></svg><kbd>V</kbd></button>
      <button class="tool" data-tool="rect" title="Rectangle (R): drag from a corner" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1"/></svg><kbd>R</kbd></button>
      <button class="tool" data-tool="circle" title="Circle (C): drag from the center" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><path d="M12 12h7.5" stroke-dasharray="2 2"/></svg><kbd>C</kbd></button>
      <button class="tool" data-tool="poly" title="Polygon (P): click points, click the first point or press Enter to close" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 18L7 5l10 3 3 10z"/></svg><kbd>P</kbd></button>
      <hr>
      <button class="tool" data-tool="pan" title="Pan (H) — or hold Space, or drag with the right mouse button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg><kbd>H</kbd></button>
    </nav>

    <div class="stage" id="stage">
      <canvas id="cv" aria-label="Cutting layout canvas"></canvas>
      <div class="hint" id="hint"></div>
      <div class="hud">
        <div class="readout" id="readout">X 0.000 &nbsp;Y 0.000 in</div>
        <div class="zoom">
          <button type="button" id="z-out" title="Zoom out" aria-label="Zoom out">−</button>
          <button type="button" id="z-fit" title="Fit to parts (F)">Fit</button>
          <button type="button" id="z-in" title="Zoom in" aria-label="Zoom in">+</button>
        </div>
      </div>
      <div class="drop" id="drop" hidden>Drop SVG to import</div>
    </div>

    <aside class="panel" aria-label="Inspector">
      <section class="sec">
        <h2>Cut summary</h2>
        <div class="size" id="sum-size">—</div>
        <div class="layers" id="sum-layers"></div>
        <dl class="kv" id="sum-kv"></dl>
      </section>
      <section class="sec">
        <h2>Checks</h2>
        <ul class="checks" id="checks"></ul>
      </section>
      <section class="sec" id="sel-sec">
        <h2>Selection</h2>
        <div id="props"></div>
      </section>
      <section class="sec">
        <h2>Settings</h2>
        <div class="fields">
          <div class="field"><label for="s-thick">Plate thickness</label><div class="unit"><input id="s-thick" type="number" step="0.0625" min="0"><i>in</i></div></div>
          <div class="field"><label for="s-ipm">Cut speed</label><div class="unit"><input id="s-ipm" type="number" step="5" min="1"><i style="right:6px">ipm</i></div></div>
          <div class="field"><label for="s-out">Outside layer</label><input id="s-out" spellcheck="false"></div>
          <div class="field"><label for="s-in">Inside layer</label><input id="s-in" spellcheck="false"></div>
        </div>
        <div class="row"><label for="s-snap">Snap to grid</label><span class="group"><input type="checkbox" id="s-snap"><select id="s-step" aria-label="Snap spacing">
          <option value="0.0625">1/16"</option><option value="0.125">1/8"</option><option value="0.25">1/4"</option><option value="0.5">1/2"</option><option value="1">1"</option></select></span></div>
        <div class="row"><label for="s-ppi">SVGs with no units</label><select id="s-ppi">
          <option value="auto">Auto-detect</option><option value="72">72 per inch (Illustrator)</option><option value="96">96 per inch (Inkscape, web)</option><option value="25.4">Millimeters</option><option value="1">Inches</option></select></div>
        <div class="row"><label for="s-origin">Put bottom-left corner at 0,0 on export</label><input type="checkbox" id="s-origin"></div>
      </section>
      <section class="sec">
        <p class="keys"><kbd>Del</kbd> delete · <kbd>Ctrl D</kbd> duplicate · arrows nudge · <kbd>Ctrl Z</kbd> undo · wheel to zoom · <kbd>Space</kbd>-drag to pan · <kbd>Esc</kbd> cancel</p>
      </section>
    </aside>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script id="core">
"use strict";
/* ===== Geometry core: everything in inches, Y up (DXF convention) ===== */
const TAU = Math.PI * 2;
const K90 = Math.tan(Math.PI / 8);          // bulge for a 90° CCW arc
const FLAT_TOL = 0.0015;                     // curve flattening tolerance, inches
const JOIN_TOL = 0.003;                      // endpoint join tolerance, inches

function bboxOf(pts){ let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  for(const p of pts){ if(p[0]<x0)x0=p[0]; if(p[0]>x1)x1=p[0]; if(p[1]<y0)y0=p[1]; if(p[1]>y1)y1=p[1]; }
  return {x0,y0,x1,y1}; }
function bbUnion(a,b){ if(!a) return b; if(!b) return a; return {x0:Math.min(a.x0,b.x0),y0:Math.min(a.y0,b.y0),x1:Math.max(a.x1,b.x1),y1:Math.max(a.y1,b.y1)}; }
function bbOverlap(a,b,e){ e=e||0; return a.x0<=b.x1+e && b.x0<=a.x1+e && a.y0<=b.y1+e && b.y0<=a.y1+e; }
function bbInside(inner,outer){ return inner.x0>=outer.x0-1e-9 && inner.x1<=outer.x1+1e-9 && inner.y0>=outer.y0-1e-9 && inner.y1<=outer.y1+1e-9; }
function polyArea(p){ let a=0; for(let i=0,n=p.length;i<n;i++){ const q=p[i], r=p[(i+1)%n]; a+=q[0]*r[1]-r[0]*q[1]; } return a/2; }
function pip(pt,poly){ const x=pt[0],y=pt[1]; let ins=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const xi=poly[i][0],yi=poly[i][1],xj=poly[j][0],yj=poly[j][1];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ins=!ins; }
  return ins; }
function perimeter(pts,closed){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  if(closed&&pts.length>2) L+=Math.hypot(pts[0][0]-pts[pts.length-1][0],pts[0][1]-pts[pts.length-1][1]); return L; }
function segDist2(px,py,ax,ay,bx,by){ const dx=bx-ax,dy=by-ay,L=dx*dx+dy*dy; let t=L?((px-ax)*dx+(py-ay)*dy)/L:0; t=t<0?0:t>1?1:t;
  const qx=ax+t*dx-px, qy=ay+t*dy-py; return qx*qx+qy*qy; }
function circlePts(cx,cy,r,n){ n=n||96; const out=[]; for(let i=0;i<n;i++){ const a=i/n*TAU; out.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); } return out; }

/* bulge arc from p to q (bulge b = tan(θ/4), θ>0 CCW): push interior points only */
function bulgeArcPts(p,q,b,out){
  const dx=q.x-p.x, dy=q.y-p.y, d=Math.hypot(dx,dy); if(d<1e-12) return;
  const s=b*d/2, r=(d*d/4+s*s)/(2*s);              // signed sagitta and radius
  const nx=-dy/d, ny=dx/d, mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
  const cx=mx+nx*(r-s), cy=my+ny*(r-s);
  const a0=Math.atan2(p.y-cy,p.x-cx), sweep=4*Math.atan(b), R=Math.abs(r);
  const steps=Math.max(4,Math.ceil(Math.abs(sweep)/(TAU/96)));
  for(let i=1;i<steps;i++){ const a=a0+sweep*i/steps; out.push([cx+R*Math.cos(a),cy+R*Math.sin(a)]); }
}
function flattenVerts(v,closed){ const out=[]; const n=v.length;
  for(let i=0;i<n;i++){ out.push([v[i].x,v[i].y]); if(!closed&&i===n-1) break; const j=(i+1)%n;
    if(Math.abs(v[i].b)>1e-12) bulgeArcPts(v[i],v[j],v[i].b,out); }
  return out; }
function cleanVerts(v){ // drop a vertex whose outgoing segment has zero length
  const out=[]; for(let i=0;i<v.length;i++){ const j=(i+1)%v.length; if(Math.hypot(v[i].x-v[j].x,v[i].y-v[j].y)>1e-9) out.push(v[i]); } return out; }
function dedupeVerts(v,closed){ const out=[];
  for(const q of v){ const l=out[out.length-1]; if(l&&Math.hypot(l.x-q.x,l.y-q.y)<1e-9){ l.b=q.b; continue; } out.push({...q}); }
  if(closed&&out.length>1){ const f=out[0], l=out[out.length-1]; if(Math.hypot(l.x-f.x,l.y-f.y)<1e-9) out.pop(); }
  return out; }
/* Geometry of the corner at vertex i: unit vectors toward both neighbors, interior angle th, turn direction */
function cornerGeom(pts,i){ const n=pts.length, P=pts[i], A=pts[(i-1+n)%n], B=pts[(i+1)%n];
  const l1=Math.hypot(A[0]-P[0],A[1]-P[1]), l2=Math.hypot(B[0]-P[0],B[1]-P[1]); if(l1<1e-9||l2<1e-9) return null;
  const u1=[(A[0]-P[0])/l1,(A[1]-P[1])/l1], u2=[(B[0]-P[0])/l2,(B[1]-P[1])/l2];
  const th=Math.acos(Math.max(-1,Math.min(1,u1[0]*u2[0]+u1[1]*u2[1]))); if(th<1e-3||th>Math.PI-1e-3) return null;
  const cr=(P[0]-A[0])*(B[1]-P[1])-(P[1]-A[1])*(B[0]-P[0]);
  return {u1,u2,th,l1,l2,turn:cr>=0?1:-1}; }
/* Fillet any corner (any angle) with a true arc. rad[i] = requested radius at vertex i.
   Where two fillets would overrun a shared edge, both shrink in proportion. Returns bulge verts + effective radii. */

  if(d>0) for(const c of cs) if(!c.closed) co.AddPath(toP(c),jt,join==='round'?CL.EndType.etOpenRound:CL.EndType.etOpenSquare);
  const sol=new CL.Paths(); co.Execute(sol,d*SC);
  const clean=CL.Clipper.CleanPolygons(sol,0.0002*SC).filter(p=>p.length>=3);
  if(!clean.length) return null;
  return {contours:tidyContours(clean.map(p=>({closed:true,pts:p.map(q=>[q.X/SC,q.Y/SC])})))};
}

/* ===== Analysis: nesting depth decides Outside vs Inside ===== */
function segsCross(a,b,c,d){
  const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  const d1=o(a,b,c), d2=o(a,b,d), d3=o(c,d,a), d4=o(c,d,b), e=1e-12;
  return ((d1>e&&d2<-e)||(d1<-e&&d2>e)) && ((d3>e&&d4<-e)||(d3<-e&&d4>e));

function analyze(shapes,opt){
  const items=[];
  for(const s of shapes) for(const c of contoursOf(s)){
    if(!c.pts||c.pts.length<2) continue;
    const bb=c.circle?{x0:c.circle.cx-c.circle.r,y0:c.circle.cy-c.circle.r,x1:c.circle.cx+c.circle.r,y1:c.circle.cy+c.circle.r}:bboxOf(c.pts);
    const area=c.closed?Math.abs(polyArea(c.pts)):0;
    const len=c.circle?TAU*c.circle.r:c.verts?perimeter(flattenVerts(c.verts,c.closed),c.closed):perimeter(c.pts,c.closed);

  }
  const closed=items.filter(i=>i.c.closed&&i.c.pts.length>=3);
  for(const a of closed){ const probe=a.c.pts[0]; let d=0;
    for(const b of closed){ if(b===a||b.area<=a.area||!bbInside(a.bb,b.bb)) continue; if(pip(probe,b.c.pts)) d++; }

  if(th>0) for(const i of closed) if(i.layer==='inside' && Math.min(i.bb.x1-i.bb.x0,i.bb.y1-i.bb.y0) < th-1e-9) i.flags.push('small');
  let crossSkipped=false;
  if(opt&&opt.full){
    let budget=4e6;
    for(let a=0;a<closed.length&&!crossSkipped;a++) for(let b=a+1;b<closed.length;b++){
      const A=closed[a], B=closed[b]; if(!bbOverlap(A.bb,B.bb)) continue;
      const P=A.c.pts, Q=B.c.pts; budget-=P.length*Q.length; if(budget<0){ crossSkipped=true; break; }
      let hit=false;
      for(let i=0;i<P.length&&!hit;i++){ const p1=P[i],p2=P[(i+1)%P.length];
        if(Math.max(p1[0],p2[0])<B.bb.x0||Math.min(p1[0],p2[0])>B.bb.x1||Math.max(p1[1],p2[1])<B.bb.y0||Math.min(p1[1],p2[1])>B.bb.y1) continue;
        for(let j=0;j<Q.length;j++){ if(segsCross(p1,p2,Q[j],Q[(j+1)%Q.length])){ hit=true; break; } } }
      if(hit){ if(!A.flags.includes('cross')) A.flags.push('cross'); if(!B.flags.includes('cross')) B.flags.push('cross'); }
    }
  }
  let bb=null, len=0; for(const i of items){ bb=bbUnion(bb,i.bb); len+=i.len; }
  return {items,bb,len,crossSkipped,
    nOut:items.filter(i=>i.layer==='outside').length, nIn:items.filter(i=>i.layer==='inside').length};
}

/* ===== DXF writer: AutoCAD R12 ASCII, inch values, true arcs where we have them ===== */
function fmt(v){ const s=(Math.abs(v)<5e-7?0:v).toFixed(6); return s.replace(/\.?0+$/,'')||'0'; }

function buildDXF(an,opt){
  const LO=layerName(opt.layerOut,'Outside'), LI=layerName(opt.layerIn,'Inside');
  const bb=an.bb||{x0:0,y0:0,x1:0,y1:0};
  const ox=opt.origin?-bb.x0:0, oy=opt.origin?-bb.y0:0;
  const L=[]; const g=(c,v)=>{ L.push(String(c),String(v)); };
  g(0,'SECTION'); g(2,'HEADER');
  g(9,'$ACADVER'); g(1,'AC1009');
  g(9,'$INSBASE'); g(10,0); g(20,0); g(30,0);
  g(9,'$EXTMIN'); g(10,fmt(bb.x0+ox)); g(20,fmt(bb.y0+oy)); g(30,0);
  g(9,'$EXTMAX'); g(10,fmt(bb.x1+ox)); g(20,fmt(bb.y1+oy)); g(30,0);
  g(9,'$INSUNITS'); g(70,1);
  g(9,'$MEASUREMENT'); g(70,0);
  g(0,'ENDSEC');
  g(0,'SECTION'); g(2,'TABLES');
  g(0,'TABLE'); g(2,'LTYPE'); g(70,1);
  g(0,'LTYPE'); g(2,'CONTINUOUS'); g(70,0); g(3,'Solid line'); g(72,65); g(73,0); g(40,'0.0');
  g(0,'ENDTAB');
  g(0,'TABLE'); g(2,'LAYER'); g(70,3);
  for(const [nm,col] of [['0',7],[LO,1],[LI,5]]){ g(0,'LAYER'); g(2,nm); g(70,0); g(62,col); g(6,'CONTINUOUS'); }
  g(0,'ENDTAB');
  g(0,'ENDSEC');
  g(0,'SECTION'); g(2,'BLOCKS'); g(0,'ENDSEC');
  g(0,'SECTION'); g(2,'ENTITIES');
  // holes first so the part stays attached to the sheet until the final outside cut
  const order=an.items.slice().sort((a,b)=>(a.layer===b.layer?0:a.layer==='inside'?-1:1) || (a.bb.y0-b.bb.y0) || (a.bb.x0-b.bb.x0));
  for(const it of order){
    const layer=it.layer==='inside'?LI:LO, c=it.c;
    if(c.circle){ g(0,'CIRCLE'); g(8,layer); g(10,fmt(c.circle.cx+ox)); g(20,fmt(c.circle.cy+oy)); g(30,0); g(40,fmt(c.circle.r)); continue; }
    const verts=c.verts?c.verts:c.pts.map(p=>({x:p[0],y:p[1],b:0}));
    g(0,'POLYLINE'); g(8,layer); g(66,1); g(10,0); g(20,0); g(30,0); g(70,c.closed?1:0);
    for(const v of verts){ g(0,'VERTEX'); g(8,layer); g(10,fmt(v.x+ox)); g(20,fmt(v.y+oy)); g(30,0); if(Math.abs(v.b)>1e-12) g(42,fmt(v.b)); }
    g(0,'SEQEND'); g(8,layer);
  }
  g(0,'ENDSEC'); g(0,'EOF');
  return L.join('\r\n')+'\r\n';
}

/* ===== Minimal ZIP (stored) so the DXF can travel through the viewer's save prompt ===== */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipOne(name,data){
  const nb=new TextEncoder().encode(name), crc=crc32(data), d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  const lh=new DataView(new ArrayBuffer(30));
  lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true); lh.setUint16(8,0,true);
  lh.setUint16(10,time,true); lh.setUint16(12,date,true); lh.setUint32(14,crc,true); lh.setUint32(18,data.length,true); lh.setUint32(22,data.length,true);
  lh.setUint16(26,nb.length,true); lh.setUint16(28,0,true);
  const cd=new DataView(new ArrayBuffer(46));
  cd.setUint32(0,0x02014b50,true); cd.setUint16(4,20,true); cd.setUint16(6,20,true); cd.setUint16(8,0,true); cd.setUint16(10,0,true);
  cd.setUint16(12,time,true); cd.setUint16(14,date,true); cd.setUint32(16,crc,true); cd.setUint32(20,data.length,true); cd.setUint32(24,data.length,true);
  cd.setUint16(28,nb.length,true); cd.setUint16(30,0,true); cd.setUint16(32,0,true); cd.setUint16(34,0,true); cd.setUint16(36,0,true); cd.setUint32(38,0,true); cd.setUint32(42,0,true);
  const end=new DataView(new ArrayBuffer(22)), cdSize=46+nb.length, cdOff=30+nb.length+data.length;
  end.setUint32(0,0x06054b50,true); end.setUint16(8,1,true); end.setUint16(10,1,true); end.setUint32(12,cdSize,true); end.setUint32(16,cdOff,true);
  const parts=[new Uint8Array(lh.buffer),nb,data,new Uint8Array(cd.buffer),nb,new Uint8Array(end.buffer)];
  const out=new Uint8Array(parts.reduce((a,p)=>a+p.length,0)); let o=0; for(const p of parts){ out.set(p,o); o+=p.length; } return out;
}
</script>

<script>
"use strict";
(function(){

const $=id=>document.getElementById(id);
const STORE='plasmapath-v1';
let shapes=[], nextId=1, selId=null, tool='select';

function newId(){ return 's'+(nextId++); }

  S.push({type:'circle',cx:7.8,cy:0.8,r:0.25});
  S.push({type:'circle',cx:7.5,cy:2,r:0.0625});

}
function load(){
  try{ const raw=localStorage.getItem(STORE); if(raw){ const d=JSON.parse(raw); if(Array.isArray(d.shapes)){ shapes=d.shapes; nextId=d.nextId||shapes.length+1; Object.assign(settings,d.settings||{}); return; } } }catch(e){}
  shapes=sampleShapes(); isSample=true;
}
let saveT=0;
function persist(){ clearTimeout(saveT); saveT=setTimeout(()=>{ try{ localStorage.setItem(STORE,JSON.stringify({shapes,nextId,settings})); }catch(e){} },300); }

function checkpoint(){ undoStack.push(JSON.stringify(shapes)); if(undoStack.length>120) undoStack.shift(); redoStack=[]; isSample=false; syncUndo(); }
function undo(){ if(!undoStack.length) return; redoStack.push(JSON.stringify(shapes)); shapes=JSON.parse(undoStack.pop()); afterChange(); }
function redo(){ if(!redoStack.length) return; undoStack.push(JSON.stringify(shapes)); shapes=JSON.parse(redoStack.pop()); afterChange(); }
function syncUndo(){ $('btn-undo').disabled=!undoStack.length; $('btn-redo').disabled=!redoStack.length; }
function getSel(){ return shapes.find(s=>s.id===selId)||null; }
function afterChange(full=true){ geomVer++; if(!getSel()) selId=null; an=analyze(shapes,{thickness:settings.thickness,full}); syncUndo(); renderPanel(); persist(); draw(); }

/* ===== Shape transforms ===== */
function shapeBB(s){ let bb=null; for(const c of contoursOf(s)) bb=bbUnion(bb,c.circle?{x0:c.circle.cx-c.circle.r,y0:c.circle.cy-c.circle.r,x1:c.circle.cx+c.circle.r,y1:c.circle.cy+c.circle.r}:bboxOf(c.pts)); return bb; }
function mapShape(s,f,rscale){ // f maps [x,y] -> [x,y]

  else if(s.type==='import') s.contours=s.contours.map(c=>{ const n={closed:c.closed,pts:c.pts.map(f)}; if(c.k) n.k=c.k; if(c.rad) n.rad=c.rad.map(r=>r*rscale); if(c.circle){ const p=f([c.circle.cx,c.circle.cy]); n.circle={cx:p[0],cy:p[1],r:c.circle.r*rscale}; } return n; });
}
function translate(s,dx,dy){

  else mapShape(s,p=>[p[0]+dx,p[1]+dy],1);
}
function rotate90(s){ const b=shapeBB(s), cx=(b.x0+b.x1)/2, cy=(b.y0+b.y1)/2;
  if(s.type==='rect'){ const w=s.w; s.w=s.h; s.h=w; s.x=cx-s.w/2; s.y=cy-s.h/2; const rc=rectRadii(s); s.rc=[rc[3],rc[0],rc[1],rc[2]]; delete s.r; }
  else if(s.type!=='circle') mapShape(s,p=>[cx-(p[1]-cy),cy+(p[0]-cx)],1); }

/* ===== Corner fillets ===== */
let geomVer=0, cornerCache={s:null,ver:-1,list:[]};
function cornersOf(s){
  if(cornerCache.s===s&&cornerCache.ver===geomVer) return cornerCache.list;
  const list=[];
  rawContours(s).forEach((raw,ci)=>{ if(raw.circle) return; const d=deriveContour(raw);
    for(const g of hardCorners(raw)){ const bx=g.u1[0]+g.u2[0], by=g.u1[1]+g.u2[1], bl=Math.hypot(bx,by); if(bl<1e-9) continue;
      const r=d.eff?(d.eff[g.i]||0):0;
      list.push({ci,i:g.i,P:raw.pts[g.i],bis:[bx/bl,by/bl],th:g.th,r,kk:Math.max(1/Math.sin(g.th/2)-1,0.25)}); } });

}
function writeRad(s,ci,rad){
  if(s.type==='rect'){ s.rc=rad.slice(0,4); delete s.r; }

function radArray(raw){ const n=raw.pts.length, r=raw.rad?raw.rad.slice(0,n):[]; while(r.length<n) r.push(0); return r; }

    const eff=filletPolygon(raw.pts,raw.closed,rad).eff; for(const c of cs) rad[c.i]=eff[c.i]; writeRad(s,ci,rad); });

function visibleHandles(){
  const s=getSel(); if(!s||tool!=='select') return [];
  const b=shapeBB(s); if(!b||Math.max(b.x1-b.x0,b.y1-b.y0)*view.z<30) return [];
  const out=[];
  for(const c of cornersOf(s)){ const [px,py]=toScreen(c.P[0],c.P[1]); const d=14+c.r*c.kk*view.z;
    const hx=px+c.bis[0]*d, hy=py-c.bis[1]*d; if(hx<-10||hy<-10||hx>W+10||hy>H+10) continue;
    out.push({c,hx,hy}); if(out.length>=400) break; }
  return out;
}
function handleAt(sp){ let best=null, bd=81; for(const h of visibleHandles()){ const d=(h.hx-sp[0])**2+(h.hy-sp[1])**2; if(d<bd){ bd=d; best=h.c; } } return best; }

  const b=shapeBB(s), bw=b.x1-b.x0, bh=b.y1-b.y0; let k=1;
  if(w!=null&&bw>0) k=w/bw; else if(h!=null&&bh>0) k=h/bh; if(!(k>0)) return;
  mapShape(s,p=>[b.x0+(p[0]-b.x0)*k,b.y0+(p[1]-b.y0)*k],k);
}

/* ===== View ===== */
const toScreen=(x,y)=>[view.ox+x*view.z, view.oy-y*view.z];
const toWorld=(sx,sy)=>[(sx-view.ox)/view.z,(view.oy-sy)/view.z];
function resize(){ const r=stage.getBoundingClientRect(); dpr=window.devicePixelRatio||1; W=Math.max(1,r.width); H=Math.max(1,r.height);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); draw(); }
function fit(){ const bb=an&&an.bb||{x0:0,y0:0,x1:12,y1:8}; const bw=Math.max(bb.x1-bb.x0,1), bh=Math.max(bb.y1-bb.y0,1);
  view.z=Math.max(4,Math.min(1500,Math.min((W-80)/bw,(H-90)/bh)));
  view.ox=W/2-(bb.x0+bw/2)*view.z; view.oy=H/2+(bb.y0+bh/2)*view.z-10; draw(); }
function zoomAt(f,sx,sy){ const [wx,wy]=toWorld(sx,sy); view.z=Math.max(2,Math.min(4000,view.z*f)); view.ox=sx-wx*view.z; view.oy=sy+wy*view.z; draw(); }

/* ===== Colors from theme tokens ===== */
const C={};
function readColors(){ const cs=getComputedStyle(document.documentElement);
  for(const k of ['sheet','ink','muted','grid','grid-major','cut-out','cut-in','warn','accent','panel']) C[k]=cs.getPropertyValue('--'+k).trim(); draw(); }

/* ===== Drawing ===== */

function paint(){

    for(let x=Math.floor(wx0/st)*st;x<=wx1;x+=st){ const sx=Math.round(view.ox+x*view.z)+.5; ctx.moveTo(sx,0); ctx.lineTo(sx,H); }
    for(let y=Math.floor(wy0/st)*st;y<=wy1;y+=st){ const sy=Math.round(view.oy-y*view.z)+.5; ctx.moveTo(0,sy); ctx.lineTo(W,sy); }
    ctx.stroke(); }

  const lblEvery=major*Math.max(1,Math.ceil(36/(major*view.z)));
  for(let x=Math.ceil(wx0/lblEvery)*lblEvery;x<=wx1;x+=lblEvery){ const sx=view.ox+x*view.z; ctx.fillText(fmtIn(x,0)+'"',sx+3,4); }
  ctx.textBaseline='bottom';
  for(let y=Math.ceil(wy0/lblEvery)*lblEvery;y<=wy1;y+=lblEvery){ if(Math.abs(y)<1e-9) continue; const sy=view.oy-y*view.z; ctx.fillText(fmtIn(y,0)+'"',4,sy-2); }
  // origin
  const [osx,osy]=toScreen(0,0); ctx.strokeStyle=C.muted; ctx.lineWidth=1.2; ctx.beginPath();
  ctx.moveTo(osx,osy); ctx.lineTo(osx+26,osy); ctx.moveTo(osx,osy); ctx.lineTo(osx,osy-26); ctx.stroke();

  // contours
  const sel=getSel();
  if(an) for(const it of an.items){
    const isSel=sel&&it.s===sel, warnIt=it.flags.length>0;
    ctx.beginPath(); tracePath(it.c);
    if(warnIt){ ctx.strokeStyle=C.warn; ctx.globalAlpha=.28; ctx.lineWidth=isSel?9:7; ctx.setLineDash([]); ctx.stroke(); ctx.globalAlpha=1; }
    ctx.strokeStyle=it.layer==='inside'?C['cut-in']:C['cut-out']; ctx.lineWidth=isSel?2.6:1.6;
    ctx.setLineDash(it.c.closed?[]:[6,4]); ctx.stroke(); ctx.setLineDash([]);
  }

  if(sel){ const b=shapeBB(sel); if(b){ const [x0,y0]=toScreen(b.x0,b.y1), [x1,y1]=toScreen(b.x1,b.y0);
    ctx.strokeStyle=C.ink; ctx.lineWidth=1; ctx.setLineDash([4,3]); ctx.strokeRect(x0-6.5,y0-6.5,x1-x0+13,y1-y0+13); ctx.setLineDash([]);
    ctx.fillStyle=C.ink; for(const [hx,hy] of [[x0-6,y0-6],[x1+6,y0-6],[x0-6,y1+6],[x1+6,y1+6]]) ctx.fillRect(hx-3,hy-3,6,6);
    const label=fmtIn(b.x1-b.x0)+' × '+fmtIn(b.y1-b.y0)+' in';
    ctx.font='500 11px "IBM Plex Mono", monospace'; const tw=ctx.measureText(label).width;

function tracePath(c){

function hitTest(w){ const tol=7/view.z;
  if(!an) return null;
  for(let k=an.items.length-1;k>=0;k--){ const it=an.items[k], c=it.c;
    if(c.circle){ if(Math.abs(Math.hypot(w[0]-c.circle.cx,w[1]-c.circle.cy)-c.circle.r)<=tol) return it.s; continue; }
    const p=c.pts, n=p.length; for(let i=0;i<n-(c.closed?0:1);i++){ const a=p[i], b=p[(i+1)%n]; if(segDist2(w[0],w[1],a[0],a[1],b[0],b[1])<=tol*tol) return it.s; } }

  let best=null, ba=Infinity; for(const it of an.items){ if(!it.c.closed) continue; if(w[0]<it.bb.x0||w[0]>it.bb.x1||w[1]<it.bb.y0||w[1]>it.bb.y1) continue;
    if(it.area<ba && pip(w,it.c.pts)){ ba=it.area; best=it.s; } }

function endPointer(e){

function fmtFixed(v){ return (Math.abs(v)<5e-4?0:v).toFixed(3); }

window.addEventListener('keydown',e=>{

}

/* Offset panel */
let offsetPreview=null, lastOffset={d:0.125,join:'round',keep:true}, offT=0;
function readOffset(){ return {d:parseFloat($('o-dist').value),join:$('o-join').value,keep:$('o-keep').checked}; }
function previewOffset(){ const s=getSel(), box=$('offset-box'); if(!s||!box||box.hidden){ offsetPreview=null; draw(); return; }
  const o=readOffset(); if(!Number.isFinite(o.d)||o.d===0){ offsetPreview=null; draw(); return; }
  try{ const r=offsetShape(s,o.d,o.join); offsetPreview=r?(r.circle?[{closed:true,circle:r.circle,pts:[]}]:r.contours):[]; }catch(e){ offsetPreview=null; }

  toast(`Offset ${o.d>0?'out':'in'} by ${fmtIn(Math.abs(o.d))}"${o.keep?'. Original kept.':'.'}`); }
$('props').addEventListener('input',e=>{ if(e.target.closest('#offset-box')){ clearTimeout(offT); offT=setTimeout(previewOffset,120); } });
function updatePropValues(){ const s=getSel(); if(!s) return; const set=(id,v)=>{ const i=$(id); if(i&&document.activeElement!==i) i.value=fmtIn(v,4); };
  if(s.type==='rect'){ set('p-x',s.x); set('p-y',s.y); set('p-w',s.w); set('p-h',s.h); }
  else if(s.type==='circle'){ set('p-cx',s.cx); set('p-cy',s.cy); set('p-d',s.r*2); }
  else { const b=shapeBB(s); set('p-x',b.x0); set('p-y',b.y0); set('p-w',b.x1-b.x0); set('p-h',b.y1-b.y0); }
  const ri=$('p-r'); if(ri&&document.activeElement!==ri){ const cs=cornersOf(s); const same=cs.length&&cs.every(c=>Math.abs(c.r-cs[0].r)<1e-6);
    ri.value=same?fmtIn(cs[0].r,4):''; ri.placeholder=same?'':'mixed'; } }
$('props').addEventListener('change',e=>{ const s=getSel(); if(!s||!e.target.id) return; const v=parseFloat(e.target.value); if(!Number.isFinite(v)){ updatePropValues(); return; }
  checkpoint(); const id=e.target.id;
  if(id==='p-r'){ setAllCorners(s,Math.max(0,v)); afterChange(); updatePropValues(); return; }
  if(s.type==='rect'){ if(id==='p-x') s.x=v; if(id==='p-y') s.y=v; if(id==='p-w'&&v>0) s.w=v; if(id==='p-h'&&v>0) s.h=v; }
  else if(s.type==='circle'){ if(id==='p-cx') s.cx=v; if(id==='p-cy') s.cy=v; if(id==='p-d'&&v>0) s.r=v/2; }
  else { const b=shapeBB(s); if(id==='p-x') translate(s,v-b.x0,0); if(id==='p-y') translate(s,0,v-b.y0); if(id==='p-w'&&v>0) scaleTo(s,v,null); if(id==='p-h'&&v>0) scaleTo(s,null,v); }
  afterChange(); updatePropValues(); });
$('props').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const s=getSel(); if(!s) return;
  const a=b.dataset.act; if(a==='dup') return duplicate(); if(a==='del') return del();
  if(a==='off'){ const box=$('offset-box'); box.hidden=!box.hidden; if(!box.hidden){ $('o-dist').focus(); $('o-dist').select(); } previewOffset(); return; }
  if(a==='off-cancel'){ $('offset-box').hidden=true; previewOffset(); return; }
  if(a==='off-apply') return applyOffset();
  checkpoint(); if(a==='rot') rotate90(s); if(a==='mir') mirror(s); afterChange(); });

/* ===== Settings ===== */
function bindSettings(){
  const pairs=[['s-thick','thickness',parseFloat],['s-ipm','ipm',parseFloat],['s-out','layerOut',String],['s-in','layerIn',String],['s-step','step',parseFloat],['s-ppi','ppi',String]];
  for(const [id,key,cast] of pairs){ const el=$(id); el.value=String(settings[key]);
    el.addEventListener('change',()=>{ const v=cast(el.value); if(cast===parseFloat&&!(v>=0)){ el.value=settings[key]; return; } settings[key]=v; afterChange();
      if(key==='ppi'&&lastImport&&lastImport.text) toast('Re-import the SVG to apply the new unit setting.'); }); }
  $('s-snap').checked=settings.snap; $('s-snap').addEventListener('change',e=>{ settings.snap=e.target.checked; persist(); });
  $('s-origin').checked=settings.origin; $('s-origin').addEventListener('change',e=>{ settings.origin=e.target.checked; persist(); });
  $('part-name').value=settings.name; $('part-name').addEventListener('change',e=>{ settings.name=e.target.value.trim()||'part'; e.target.value=settings.name; persist(); });
}

/* ===== Import ===== */
let lastImport=null;
function doImport(text,name){
  let res; try{ res=importSVG(text,settings.ppi); }catch(err){ toast(err.message||'Could not read that SVG.'); return; }
  if(!res.contours.length){ toast('No cuttable paths found in that SVG.'); return; }
  lastImport={warn:res.warn,text:true};
  const sh={type:'import',name:name||'artwork',contours:res.contours};
  const b=shapeBB(sh); let dx=-b.x0, dy=-b.y0;
  if(!isSample && shapes.length){ const all=an&&an.bb; if(all){ dx=all.x1+1-b.x0; dy=all.y0-b.y0; } }
  if(isSample){ shapes=[]; isSample=false; }
  translate(sh,dx,dy);
  addShape(sh); fit();
  const w=b.x1-b.x0, h=b.y1-b.y0;
  toast(`Imported ${res.contours.length} paths at ${fmtIn(w)} × ${fmtIn(h)} in`+(res.unitsFromFile?'.':` (read as ${res.ppi===25.4?'millimeters':res.ppi===1?'inches':res.ppi+' units per inch'}). Wrong size? Type the width in Selection.`));
  if(name){ const base=name.replace(/\.svg$/i,''); settings.name=base; $('part-name').value=base; persist(); }
}
$('file-in').addEventListener('change',async e=>{ const f=e.target.files[0]; if(!f) return; doImport(await f.text(),f.name); e.target.value=''; });
$('lbl-import').addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('file-in').click(); } });
let dragDepth=0;
stage.addEventListener('dragenter',e=>{ e.preventDefault(); dragDepth++; $('drop').hidden=false; });
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('dragleave',()=>{ if(--dragDepth<=0){ dragDepth=0; $('drop').hidden=true; } });
stage.addEventListener('drop',async e=>{ e.preventDefault(); dragDepth=0; $('drop').hidden=true; const f=e.dataTransfer.files[0]; if(f) doImport(await f.text(),f.name); });
window.addEventListener('paste',e=>{ const t=e.target; if(t&&(t.tagName==='INPUT')) return; const s=e.clipboardData&&e.clipboardData.getData('text/plain'); if(s&&/<svg[\s>]/i.test(s)){ e.preventDefault(); doImport(s,null); } });

/* ===== Export ===== */
function currentDXF(){ const a=analyze(shapes,{thickness:settings.thickness,full:false}); if(!a.items.length) return null;
  return buildDXF(a,{layerOut:settings.layerOut,layerIn:settings.layerIn,origin:settings.origin}); }
function fileBase(){ return (settings.name||'part').replace(/[\\/:*?"<>|]+/g,'-').replace(/\.dxf$/i,'')||'part'; }
$('btn-dl').addEventListener('click',async()=>{
  const dxf=currentDXF(); if(!dxf){ toast('Nothing to export yet. Draw or import a part first.'); return; }
  const base=fileBase(), bytes=new TextEncoder().encode(dxf);
  if(window.claude&&typeof window.claude.use==='function'){
    let dl=null; try{ dl=await window.claude.use('downloads'); }catch(e){}
    if(dl){ try{ await dl.save({filename:base+'.zip',data:zipOne(base+'.dxf',bytes)}); toast(`Saved ${base}.zip. Unzip it to get ${base}.dxf.`); }
      catch(err){ if(err&&err.code==='declined') return; if(err&&err.code==='rate_limited'){ toast('A save prompt is already open.'); return; } toast('Saving is unavailable here. Use Copy DXF and paste into a text file named '+base+'.dxf.'); }
      return; }
    toast('Saving is unavailable here. Use Copy DXF and paste into a text file named '+base+'.dxf.'); return;
  }
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/dxf'})); const a=document.createElement('a'); a.href=url; a.download=base+'.dxf';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); toast(`Downloaded ${base}.dxf`);
});
$('btn-copy').addEventListener('click',()=>{ const dxf=currentDXF(); if(!dxf){ toast('Nothing to copy yet.'); return; }
  const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(dxf):Promise.reject();
  p.then(()=>toast(`DXF copied. Paste it into a plain text file and save it as ${fileBase()}.dxf.`),()=>toast('Copy was blocked here. Try Download DXF instead.')); });

/* ===== Top bar ===== */
let newArmed=0;
$('btn-new').addEventListener('click',()=>{ if(!shapes.length) return;
  if(!isSample&&Date.now()-newArmed>3000){ newArmed=Date.now(); toast('Press New again to clear the table. Undo still works after.'); return; }
  checkpoint(); shapes=[]; selId=null; lastImport=null; isSample=false; afterChange(); setHint(); });
$('btn-undo').addEventListener('click',undo); $('btn-redo').addEventListener('click',redo);
for(const b of document.querySelectorAll('.tool')) b.addEventListener('click',()=>setTool(b.dataset.tool));
$('z-in').addEventListener('click',()=>zoomAt(1.4,W/2,H/2)); $('z-out').addEventListener('click',()=>zoomAt(1/1.4,W/2,H/2)); $('z-fit').addEventListener('click',fit);

let toastT=0; function toast(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>{ t.hidden=true; },4200); }

/* ===== Boot ===== */
load(); bindSettings(); readColors();
new ResizeObserver(resize).observe(stage);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',readColors);
new MutationObserver(readColors).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
resize(); afterChange(); fit(); setHint(); syncUndo();
})();
</script>
