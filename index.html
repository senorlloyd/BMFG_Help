<!-- NC to SBP -->
<div class="NC2SBP">
	<p>NC to SBP Converter</p>
    <div class="dropBox" id="dropArea">
        <p>Drag & drop your .nc file here, or click to select</p>
        <input type="file" id="fileInput" accept=".nc,.gcode" style="display:none">
    </div>
	
	<p class = "rpm">RPM: </p>
	<input type="number" class="rpm" id="speedInput" value="12000" min="1000" step="500">
    <button class="DownloadButton" id="processBtn">Convert & Download</button>

    <script src="js/NC2SBP.js"></script>
</div>
