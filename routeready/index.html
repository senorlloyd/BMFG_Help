<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RouteReady</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body { margin: 0; }
/* Layout: Easel-style workbench. Tool rail | design sheet with floating inspector | carve preview column. */
:root {
  --chrome: #1c2330; --chrome-2: #273041; --chrome-ink: #e9eef5; --chrome-muted: #9ba7b8;
  --bg: #eef1f5; --panel: #ffffff; --panel-2: #f4f6f9; --ink: #1a2230; --muted: #5b6676; --line: #d6dce5;
  --accent: #2a5fc4; --accent-ink: #ffffff; --accent-soft: #e2eafa;
  --workspace: #cddaea; --sheet: #ffffff; --grid: #e4eaf2; --grid-major: #c4d0e0; --axis: #8ca4c4;
  --shape: #2a5fc4; --shape-fill: rgba(42, 95, 196, .07); --cutband: rgba(18, 24, 34, .66); --zero: #dd4425;
  --wood: #e5cba4; --wood-grain: #d0ae7e; --wood-cut: #9a774d; --wood-deep: #5d4428; --through: #f6f7f9;
  --tray: #dfe5ee; --warn: #9a6512; --warn-soft: #fbf0db;
  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome: #10141b; --chrome-2: #1d2430; --chrome-ink: #e6ebf2; --chrome-muted: #8e9aab;
    --bg: #161b23; --panel: #1d232d; --panel-2: #242b37; --ink: #e5eaf1; --muted: #98a3b3; --line: #333b49;
    --accent: #6d9af0; --accent-ink: #0c1320; --accent-soft: #233251;
    --workspace: #18212d; --sheet: #212935; --grid: #29323f; --grid-major: #39455a; --axis: #557091;
    --shape: #7fa6f4; --shape-fill: rgba(127, 166, 244, .08); --cutband: rgba(226, 233, 243, .5); --zero: #f0623f;
    --wood: #cdb08a; --wood-grain: #b7956a; --wood-cut: #7a5d3d; --wood-deep: #4a3721; --through: #b4bcc7;
    --tray: #151a22; --warn: #e3b25c; --warn-soft: #33291a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome: #10141b; --chrome-2: #1d2430; --chrome-ink: #e6ebf2; --chrome-muted: #8e9aab;
  --bg: #161b23; --panel: #1d232d; --panel-2: #242b37; --ink: #e5eaf1; --muted: #98a3b3; --line: #333b49;
  --accent: #6d9af0; --accent-ink: #0c1320; --accent-soft: #233251;
  --workspace: #18212d; --sheet: #212935; --grid: #29323f; --grid-major: #39455a; --axis: #557091;
  --shape: #7fa6f4; --shape-fill: rgba(127, 166, 244, .08); --cutband: rgba(226, 233, 243, .5); --zero: #f0623f;
  --wood: #cdb08a; --wood-grain: #b7956a; --wood-cut: #7a5d3d; --wood-deep: #4a3721; --through: #b4bcc7;
  --tray: #151a22; --warn: #e3b25c; --warn-soft: #33291a;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.4 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

/* top bar */
.top { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; background: var(--chrome); color: var(--chrome-ink);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; font: 700 19px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.brand svg { width: 26px; height: 26px; flex: none; }
.projname { background: transparent; border: 1px solid transparent; border-radius: var(--r); color: var(--chrome-ink); padding: 5px 8px; font-weight: 500; min-width: 0; width: 15em; max-width: 40vw; }
.projname:hover { border-color: var(--chrome-2); }
.projname:focus { background: var(--chrome-2); outline: none; border-color: var(--accent); }
.menu { display: flex; align-items: center; gap: 2px; }
.menu button { background: none; border: 0; color: var(--chrome-muted); padding: 6px 9px; border-radius: var(--r); display: inline-flex; align-items: center; gap: 6px; }
.menu button:hover { background: var(--chrome-2); color: var(--chrome-ink); }
.menu button:disabled { opacity: .35; cursor: default; background: none; }
.menu svg { width: 16px; height: 16px; }
.menu .sep { width: 1px; height: 20px; background: var(--chrome-2); margin: 0 6px; }
.top-right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.btn-primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: var(--r); padding: 8px 16px; font-weight: 600; letter-spacing: .01em; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary:hover { filter: brightness(1.08); }
.btn-primary svg { width: 16px; height: 16px; }

/* main */
.main { display: grid; grid-template-columns: 52px minmax(0, 1fr) 7px var(--pvw, minmax(330px, 34%)); min-height: 0; }
.split { cursor: col-resize; background: var(--line); position: relative; touch-action: none; }
.split::after { content: ""; position: absolute; left: 2px; top: 50%; width: 3px; height: 36px; margin-top: -18px; border-radius: 2px; background: var(--muted); opacity: .45; }
.split:hover, .split.dragging, .split:focus-visible { background: var(--accent); outline: none; }
.split:hover::after, .split.dragging::after { background: var(--accent-ink); opacity: .9; }
body.resizing, body.resizing * { cursor: col-resize !important; user-select: none; }
.tools { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 10px; }
.tools button { width: 38px; height: 38px; border: 0; background: none; border-radius: var(--r); color: var(--muted); display: grid; place-items: center; position: relative; }
.tools button:hover { background: var(--panel-2); color: var(--ink); }
.tools button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
.tools svg { width: 20px; height: 20px; }
.tools hr { width: 26px; border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

.design { position: relative; min-width: 0; min-height: 0; background: var(--workspace); }
.stage { position: absolute; inset: 0; }
#dcv { display: block; width: 100%; height: 100%; touch-action: none; }
.hud { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; font: 12px var(--f-mono); color: var(--muted); }
.hud > * { pointer-events: auto; }
.hud .xy { font-variant-numeric: tabular-nums; min-width: 12em; }
.hud .zoom { margin-left: auto; display: flex; gap: 2px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 2px; }
.hud .zoom button { border: 0; background: none; width: 28px; height: 26px; border-radius: 4px; color: var(--ink); display: grid; place-items: center; }
.hud .zoom button:hover { background: var(--panel-2); }
.hud .zoom svg { width: 15px; height: 15px; }
.chk { white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; font: 12px var(--f-body); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 4px 9px; cursor: pointer; user-select: none; }
.chk input { accent-color: var(--accent); margin: 0; }
.drop-hint { position: absolute; inset: 14px; border: 2px dashed var(--accent); border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--panel) 70%, transparent); font: 600 20px var(--f-display); letter-spacing: .03em; color: var(--accent); text-transform: uppercase; pointer-events: none; }

/* inspector */
.inspector { position: absolute; top: 12px; right: 12px; width: 262px; max-height: calc(100% - 64px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 22px rgba(15, 25, 45, .14); }
.insp-sec { padding: 12px 14px; display: grid; gap: 10px; }
.insp-sec + .insp-sec { border-top: 1px solid var(--line); }
.eyebrow { font: 600 11px/1 var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.insp-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.insp-tabs button { border: 0; background: var(--panel-2); padding: 9px; font: 600 13px var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.insp-tabs button[aria-selected="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 -2px 0 var(--accent); }
.align { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.align button, .iconbtn { border: 1px solid transparent; background: none; border-radius: 4px; height: 30px; display: grid; place-items: center; color: var(--muted); }
.align button:hover, .iconbtn:hover { background: var(--panel-2); color: var(--ink); border-color: var(--line); }
.align svg, .iconbtn svg { width: 17px; height: 17px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
.fld { display: grid; gap: 4px; min-width: 0; }
.fld > span { font-size: 12px; color: var(--muted); }
.unit { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); overflow: hidden; }
.unit:focus-within { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.unit input { border: 0; background: none; padding: 6px 8px; width: 100%; min-width: 0; font: 13px var(--f-mono); font-variant-numeric: tabular-nums; outline: none; }
.unit i { font: normal 11px var(--f-mono); color: var(--muted); padding: 0 8px; display: grid; place-items: center; background: var(--panel-2); border-left: 1px solid var(--line); }
.txt, .sel { border: 1px solid var(--line); border-radius: 5px; background: var(--panel); padding: 6px 8px; width: 100%; min-width: 0; }
.txt:focus, .sel:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 2px var(--accent-soft); }
.row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 5px; padding: 6px 10px; display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
.btn:hover { background: var(--panel-2); }
.btn svg { width: 15px; height: 15px; }
.btn.danger { color: var(--zero); }
.btn.center0 { width: 100%; justify-content: center; padding: 8px 10px; font-weight: 600; color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.btn.center0:hover { background: var(--accent-soft); filter: brightness(1.04); }
.btn.center0 svg { width: 17px; height: 17px; }
.cuttypes { display: grid; gap: 4px; }
.cuttype { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; background: var(--panel); text-align: left; }
.cuttype:hover { border-color: var(--grid-major); background: var(--panel-2); }
.cuttype[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.cuttype svg { width: 34px; height: 26px; }
.cuttype b { display: block; font-weight: 600; font-size: 13px; }
.cuttype small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.25; }
.depthrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.note { font-size: 12px; color: var(--muted); line-height: 1.45; }
.note kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel-2); color: var(--ink); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 10px; font-size: 12px; color: var(--muted); }
.keys kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel-2); color: var(--ink); justify-self: start; }

/* preview column */
.preview { display: flex; flex-direction: column; min-height: 0; min-width: 0; border-left: 1px solid var(--line); background: var(--panel); }
.setup { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.card { border: 0; border-right: 1px solid var(--line); background: var(--panel); text-align: left; padding: 9px 12px 10px; display: grid; gap: 2px; min-width: 0; }
.card:last-child { border-right: 0; }
.card:hover { background: var(--panel-2); }
.card[aria-expanded="true"] { box-shadow: inset 0 0 0 2px var(--ink); }
.card .eyebrow { display: flex; justify-content: space-between; }
.card b { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card small { font: 11.5px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop { position: absolute; top: 100%; left: 8px; right: 8px; z-index: 5; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 28px rgba(15, 25, 45, .18); max-height: min(72vh, 640px); overflow: auto; }
.zerotiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.zerotile { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 10px; display: grid; gap: 8px; justify-items: center; font-size: 13px; }
.zerotile[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.zerotile svg { width: 64px; height: 44px; }
details.adv summary { cursor: pointer; font-size: 13px; color: var(--muted); }
details.adv textarea { width: 100%; min-height: 84px; font: 12px/1.45 var(--f-mono); border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); padding: 8px; resize: vertical; white-space: pre; }
.pv-wrap { position: relative; flex: 1; min-height: 200px; background: var(--tray); }
#pcv, #pcv3 { display: block; width: 100%; height: 100%; position: absolute; inset: 0; }
#pcv3 { touch-action: none; cursor: grab; }
#pcv3.grabbing { cursor: grabbing; }
.pv-bar { position: absolute; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; pointer-events: none; }
.pv-bar > * { pointer-events: auto; }
.seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 2px; }
.seg button { border: 0; background: none; padding: 4px 11px; border-radius: 4px; font: 600 12px var(--f-display); letter-spacing: .06em; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: .4; cursor: default; }
.viewbtns { display: inline-flex; gap: 4px; }
.viewbtns .btn { padding: 4px 9px; font-size: 12px; }
.pv-hint { position: absolute; right: 12px; top: 46px; font-size: 11.5px; color: var(--muted); pointer-events: none; }
.pv-legend { position: absolute; left: 12px; bottom: 10px; pointer-events: none; display: flex; gap: 12px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
.pv-legend span { display: inline-flex; gap: 5px; align-items: center; }
.pv-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; box-shadow: inset 0 0 0 1px var(--line); }
.pv-foot { border-top: 1px solid var(--line); padding: 10px 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); display: grid; gap: 8px; }
.stats { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; }
.stat { display: grid; gap: 2px; }
.stat b { font: 600 20px/1 var(--f-display); letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.sim { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.sim .play { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; }
.sim .play:hover { background: var(--panel-2); }
.sim .play svg { width: 14px; height: 14px; }
.sim output { font: 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; min-width: 6.5em; text-align: right; }
.warns { display: grid; gap: 4px; }
.warn { font-size: 12.5px; color: var(--warn); background: var(--warn-soft); border-radius: 5px; padding: 5px 8px; }
.foot-actions { display: flex; gap: 6px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--chrome); color: var(--chrome-ink); padding: 9px 14px; border-radius: 6px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .18s, transform .18s; max-width: min(92vw, 520px); z-index: 30; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.modal { position: fixed; inset: 0; background: rgba(10, 14, 22, .45); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal-card { background: var(--panel); border-radius: 10px; padding: 18px; width: min(380px, 100%); display: grid; gap: 12px; box-shadow: 0 18px 50px rgba(0, 0, 0, .3); }
.modal-card h2 { margin: 0; font: 600 20px var(--f-display); letter-spacing: .01em; }
.modal-card p { margin: 0; color: var(--muted); }
.modal-card .row { justify-content: flex-end; }
.modal-card textarea { width: 100%; min-height: 160px; font: 11.5px/1.4 var(--f-mono); border: 1px solid var(--line); border-radius: 5px; background: var(--panel-2); padding: 8px; }


/* setup wizard */
.wiz { position: fixed; inset: 0; z-index: 60; overflow: auto; display: flex; flex-direction: column;
  background-color: var(--workspace);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wiz-card { margin: auto; width: min(940px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 24px 60px rgba(15, 25, 45, .2); overflow: hidden; }
.wz-head { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; padding: 12px 18px; background: var(--chrome); color: var(--chrome-ink); }
.wz-prog { list-style: none; margin: 0; padding: 0; display: flex; gap: 2px; flex: 1; justify-content: center; flex-wrap: wrap; }
.wz-prog button { background: none; border: 0; color: var(--chrome-muted); display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px; font: 500 13px var(--f-body); }
.wz-prog b { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 11.5px var(--f-mono); border: 1.5px solid currentColor; }
.wz-prog .cur button { color: var(--chrome-ink); }
.wz-prog .cur b { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.wz-prog .done button { color: var(--chrome-ink); cursor: pointer; }
.wz-prog .done button:hover { background: var(--chrome-2); }
.wz-prog .done b { background: var(--chrome-2); border-color: var(--chrome-2); }
.wz-prog button:disabled { cursor: default; }
.wz-skip { background: none; border: 1px solid var(--chrome-2); color: var(--chrome-ink); border-radius: 6px; padding: 6px 10px; font-size: 13px; }
.wz-skip:hover { background: var(--chrome-2); }
.wz-body { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); min-height: 420px; }
.wz-vis { margin: 0; background: var(--panel-2); border-right: 1px solid var(--line); display: grid; grid-template-rows: 1fr auto; align-items: center; padding: 18px; gap: 6px; }
.wz-vis svg { display: block; width: 100%; height: auto; max-height: 360px; }
.wz-vis figcaption { font-size: 12px; color: var(--muted); text-align: center; }
.wz-q { padding: 26px 28px; display: grid; align-content: start; gap: 14px; min-width: 0; }
.wz-q h2 { margin: 0; font: 600 30px/1.1 var(--f-display); letter-spacing: .005em; text-wrap: balance; }
.wz-help { margin: 0; color: var(--muted); max-width: 46ch; line-height: 1.5; }
.wz-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wz-fields.one { grid-template-columns: minmax(0, 220px); }
.unit.big input, .txt.big { font-size: 21px; padding: 9px 12px; font-family: var(--f-mono); }
.txt.big { font-family: var(--f-body); font-size: 17px; }
.unit.big i { font-size: 13px; padding: 0 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips-l { font-size: 12px; color: var(--muted); width: 100%; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px; font: 500 13px var(--f-mono); }
.chip:hover { background: var(--panel-2); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.wz-tip { margin: 0; font-size: 12.5px; color: var(--muted); }
.wz-bits { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.wz-bit { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 10px 8px 12px; display: grid; justify-items: center; align-content: start; gap: 4px; text-align: center; }
.wz-bit svg { width: 30px; height: 50px; }

.wz-bit small { color: var(--muted); font-size: 11.5px; line-height: 1.3; }
.wz-bit:hover, .wz-zero:hover { border-color: var(--grid-major); background: var(--panel-2); }
.wz-bit[aria-pressed="true"], .wz-zero[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.wz-other { justify-self: start; font-family: var(--f-body); }
.wz-cutset { font-size: 13px; background: var(--panel-2); border-radius: 6px; padding: 9px 11px; line-height: 1.45; }
.wz-zeros { display: grid; gap: 8px; }
.wz-zero { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 12px 14px; }
.wz-zero svg { width: 76px; height: 52px; }
.wz-zero b { display: block; font: 600 18px var(--f-display); }
.wz-zero small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.4; margin-top: 2px; }
.wz-sum { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; margin: 0; align-items: baseline; padding: 12px 14px; background: var(--panel-2); border-radius: 8px; }
.wz-sum dt { font: 600 11px var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.wz-sum dd { margin: 0; font: 500 13.5px var(--f-mono); min-width: 0; }
.wz-sum button { background: none; border: 0; color: var(--accent); font-size: 12.5px; padding: 0; }
.wz-foot { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line); }
.wz-err { flex: 1; font-size: 13px; color: var(--zero); min-width: 0; }
.wz-err.warn { color: var(--warn); }
.wz-foot .btn-primary { padding: 10px 24px; font-size: 15px; }
.btn-primary:disabled { opacity: .45; cursor: not-allowed; filter: none; }
.wz-vis .dim path { stroke: var(--muted); fill: none; stroke-width: 1.2; }
.wz-vis .dim .ah { fill: var(--muted); stroke: none; }
.wz-vis .dim text { fill: var(--ink); font: 600 13px var(--f-mono); }
.wz-vis .dim .sub { fill: var(--muted); font: 500 11.5px var(--f-body); }
.wz-vis .dim.on path { stroke: var(--accent); }
.wz-vis .dim.on .ah { fill: var(--accent); }
.wz-vis .dim.on text { fill: var(--accent); }
.wz-lbl { font: 500 12px var(--f-body); fill: var(--muted); }
.wz-zl { font: 600 13px var(--f-mono); fill: var(--zero); }
.wz-vis .axes path { stroke: var(--zero); stroke-width: 1.6; fill: none; }
.wz-vis .axes .ah { fill: var(--zero); stroke: none; }
.wz-vis .axes text { font: 600 11px var(--f-mono); fill: var(--zero); }
.wz-welcome { padding: 36px 28px 30px; display: grid; gap: 24px; justify-items: center; text-align: center; }
.wz-hero svg { width: 56px; height: 56px; }
.wz-hero h1 { margin: 10px 0 6px; font: 700 42px/1 var(--f-display); letter-spacing: .02em; text-transform: uppercase; }
.wz-hero p { margin: 0; color: var(--muted); font-size: 15px; }
.wz-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: min(660px, 100%); }
.wz-opt { position: relative; display: grid; gap: 12px; justify-items: start; align-content: start; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 20px; }
.wz-opt:hover { border-color: var(--accent); background: var(--panel-2); }
.wz-opt.primary { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.wz-opt svg { width: 30px; height: 30px; color: var(--accent); }
.wz-opt b { font: 600 22px var(--f-display); display: block; }
.wz-opt small { color: var(--muted); font-size: 13px; line-height: 1.45; display: block; margin-top: 4px; }
.wz-opt i { position: absolute; top: 16px; right: 16px; font: normal 600 10.5px var(--f-display); letter-spacing: .08em; text-transform: uppercase; background: var(--accent); color: var(--accent-ink); padding: 3px 7px; border-radius: 4px; }
.wz-link { background: none; border: 0; color: var(--accent); font-size: 14px; }
.wz-note { margin: 0; font-size: 12.5px; color: var(--muted); }
@media (max-width: 760px) {
  .wz-body { grid-template-columns: 1fr; min-height: 0; }
  .wz-vis { border-right: 0; border-bottom: 1px solid var(--line); padding: 10px; }

  .wz-prog span { display: none; }
  .wz-head .brand { display: none; }
  .wz-prog { flex-wrap: nowrap; justify-content: flex-start; }
  .wz-opts { grid-template-columns: 1fr; }
  .wz-q { padding: 18px 16px; }
  .wz-q h2 { font-size: 25px; }
  .wz-bit small { display: none; }
  .wz-hero h1 { font-size: 34px; }
}

@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
@media (max-width: 900px) {
  body { overflow: auto; }
  .app { height: auto; min-height: 100%; }
  .main { grid-template-columns: 48px minmax(0, 1fr); }
  .tools { grid-row: 1; }
  .design { display: flex; flex-direction: column; }
  .stage { position: relative; inset: auto; height: 58vh; min-height: 300px; }

  .pv-wrap { flex: none; height: 52vh; }
  .projname { width: 9em; }

      <button id="btnSave" title="Save project file"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3M7 21v-7h10v7"/></svg><span class="lbl">Save</span></button>
      <span class="sep"></span>
      <button id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
      <button id="btnRedo" title="Redo (Ctrl+Shift+Z)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>

<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script>
/* RouteReady engine: geometry, import parsing (DXF + SVG path data), toolpaths, G-code.
   Pure functions only (no DOM), so it can be tested outside the browser.
   Units are inches. Material coordinates: origin at the material's front-left corner, Y up. */
var RR = (function () {
  'use strict';
  const SC = 10000; // Clipper integer scale: 0.0001 in

  // ---------- small geometry helpers ----------
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  function area(pts) {
    let s = 0;
    for (let i = 0, n = pts.length; i < n; i++) {
      const a = pts[i], b = pts[(i + 1) % n];
      s += a[0] * b[1] - b[0] * a[1];
    }
    return s / 2;
  }
  function bboxOf(contours) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const c of contours) for (const p of c.pts) {
      if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0];
      if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1];
    }
    if (!isFinite(x0)) return { x0: 0, y0: 0, x1: 0, y1: 0, w: 0, h: 0 };
    return { x0, y0, x1, y1, w: x1 - x0, h: y1 - y0 };
  }
  function pointInPoly(pt, pts) {
    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function pointInSet(pt, loops) { // even-odd across several loops
    let c = 0;
    for (const l of loops) if (pointInPoly(pt, l)) c++;
    return c % 2 === 1;
  }
  // Ramer-Douglas-Peucker on an open polyline
  function rdp(pts, eps) {
    if (pts.length < 3) return pts.slice();
    const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
    const stack = [[0, pts.length - 1]];
    while (stack.length) {
      const [a, b] = stack.pop();
      const A = pts[a], B = pts[b];
      const dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy);
      let md = -1, mi = -1;
      for (let i = a + 1; i < b; i++) {
        const P = pts[i];
        const d = L < 1e-12 ? dist(P, A) : Math.abs(dy * P[0] - dx * P[1] + B[0] * A[1] - B[1] * A[0]) / L;
        if (d > md) { md = d; mi = i; }
      }
      if (md > eps) { keep[mi] = 1; stack.push([a, mi], [mi, b]); }
    }
    return pts.filter((_, i) => keep[i]);
  }
  // Tidy a contour: merge near-duplicate points, detect closure, simplify.
  function tidy(c, eps) {
    eps = eps || 0.0004;
    let pts = [];
    for (const p of c.pts) {
      if (!isFinite(p[0]) || !isFinite(p[1])) continue;
      if (!pts.length || dist(p, pts[pts.length - 1]) > 1e-6) pts.push([p[0], p[1]]);
    }
    let closed = !!c.closed;
    if (pts.length > 2 && dist(pts[0], pts[pts.length - 1]) < 0.002) { closed = true; pts.pop(); }
    if (closed) { pts.push(pts[0]); pts = rdp(pts, eps); pts.pop(); }
    else pts = rdp(pts, eps);
    if (closed && pts.length < 3) return null;
    if (!closed && pts.length < 2) return null;
    return { pts, closed };
  }

  // ---------- curve flattening (shared by SVG + DXF) ----------
  function flatCubic(out, p0, p1, p2, p3, seg) {
    const L = dist(p0, p1) + dist(p1, p2) + dist(p2, p3);
    const n = Math.max(4, Math.min(400, Math.ceil(L / seg)));
    for (let i = 1; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([
        u * u * u * p0[0] + 3 * u * u * t * p1[0] + 3 * u * t * t * p2[0] + t * t * t * p3[0],
        u * u * u * p0[1] + 3 * u * u * t * p1[1] + 3 * u * t * t * p2[1] + t * t * t * p3[1]]);
    }
  }
  function flatQuad(out, p0, p1, p2, seg) {
    const L = dist(p0, p1) + dist(p1, p2);
    const n = Math.max(4, Math.min(400, Math.ceil(L / seg)));
    for (let i = 1; i <= n; i++) {
      const t = i / n, u = 1 - t;
      out.push([u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]]);
    }
  }
  // circular/elliptical arc by center parametrization; pushes points after the start
  function flatArcCenter(out, cx, cy, rx, ry, phi, t0, dt, seg) {
    const r = Math.max(rx, ry);
    const n = Math.max(2, Math.min(720, Math.ceil(Math.abs(dt) * r / seg), Math.ceil(Math.abs(dt) / (Math.PI / 90))));
    const c = Math.cos(phi), s = Math.sin(phi);
    for (let i = 1; i <= n; i++) {
      const t = t0 + dt * i / n;
      const x = rx * Math.cos(t), y = ry * Math.sin(t);
      out.push([cx + c * x - s * y, cy + s * x + c * y]);
    }
  }
  // SVG endpoint arc -> points (spec F.6.5)
  function flatArcSvg(out, x1, y1, rx, ry, angDeg, fa, fs, x2, y2, seg) {
    if (x1 === x2 && y1 === y2) return;
    rx = Math.abs(rx); ry = Math.abs(ry);
    if (!rx || !ry) { out.push([x2, y2]); return; }
    const phi = angDeg * Math.PI / 180, c = Math.cos(phi), s = Math.sin(phi);
    const dx = (x1 - x2) / 2, dy = (y1 - y2) / 2;
    const x1p = c * dx + s * dy, y1p = -s * dx + c * dy;
    let lam = (x1p * x1p) / (rx * rx) + (y1p * y1p) / (ry * ry);
    if (lam > 1) { const k = Math.sqrt(lam); rx *= k; ry *= k; }
    let num = rx * rx * ry * ry - rx * rx * y1p * y1p - ry * ry * x1p * x1p;
    let den = rx * rx * y1p * y1p + ry * ry * x1p * x1p;
    let co = Math.sqrt(Math.max(0, num / den)) * (fa === fs ? -1 : 1);
    const cxp = co * rx * y1p / ry, cyp = -co * ry * x1p / rx;

  g += `<defs><clipPath id="wzFl"><rect x="${cx - fw / 2}" y="${fTop}" width="${fw}" height="${fBot - fTop}"/></clipPath></defs>`;
  g += `<rect x="${cx - fw / 2}" y="${fTop}" width="${fw}" height="${fBot - fTop}" fill="var(--grid-major)" stroke="var(--muted)"/>`;
  g += `<g clip-path="url(#wzFl)" stroke="var(--muted)" stroke-width="1.2">`;
  for (let y = fTop - fw; y < fBot + fw; y += 12) g += `<path d="M${cx - fw / 2} ${y + fw * 0.6}L${cx + fw / 2} ${y}"/>`;
  g += `</g>`;
  const x1 = cx - fw / 2, x2 = cx + fw / 2, yd = 252;
  g += `<g class="dim on"><path d="M${x1} ${by1 + 3}V${yd + 6}M${x2} ${by1 + 3}V${yd + 6}M${x1 - 14} ${yd}H${x2 + 14}"/><path class="ah" d="M${x1} ${yd}l-8 -4v8zM${x2} ${yd}l8 -4v8z"/><text x="${x2 + 20}" y="${yd + 4}">${fracIn(dv)} in wide cut</text></g>`;
  return svgWrap(g, `A ${fracIn(dv)} inch bit cutting a groove`);
}
const bitMini = d => {
  const w = Math.max(3, Math.min(14, d * 48)), sw = Math.max(w, 6);
  return `<svg viewBox="0 0 30 50" aria-hidden="true"><rect x="${15 - sw / 2}" y="2" width="${sw}" height="22" rx="1.5" fill="var(--grid)" stroke="var(--muted)"/><rect x="${15 - w / 2}" y="24" width="${w}" height="22" fill="var(--grid-major)" stroke="var(--muted)"/><path d="M${15 - w / 2} 32l${w} -4M${15 - w / 2} 38l${w} -4M${15 - w / 2} 44l${w} -4" stroke="var(--muted)"/></svg>`;
};
const zMini = z => `<svg viewBox="0 0 76 52" aria-hidden="true"><rect x="4" y="4" width="68" height="42" rx="2" fill="var(--wood)" stroke="var(--wood-deep)"/><path d="M4 46H72" stroke="var(--ink)" stroke-width="2.5"/><circle cx="${z === 'center' ? 38 : 5}" cy="${z === 'center' ? 25 : 45}" r="5" fill="var(--zero)"/></svg>`;

// ----- screens -----
function bigField(id, label, val) {
  return `<label class="fld"><span>${label}</span><span class="unit big"><input id="${id}" inputmode="decimal" value="${esc(val)}" autocomplete="off" spellcheck="false"><i>in</i></span></label>`;
}
function welcomeHTML() {
  const advSub = WZ.fromNew ? 'Empty design with the same wood and bit settings. Change anything in the workspace.'
    : hadSaved ? `Pick up your last project, "${esc(P.name)}", and set everything yourself.` : 'Go straight to the full workspace and set everything yourself.';
  return `<div class="wz-welcome">
    <div class="wz-hero">${LOGO}<h1>${WZ.fromNew ? 'New project' : 'RouteReady'}</h1><p>Design 2D cuts and make files for the ShopBot.</p></div>
    <div class="wz-opts">
      <button class="wz-opt primary" data-wz="guided"><i>Recommended</i>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <span><b>Guided setup</b><small>Answer four quick questions about your wood and bit, then start designing.</small></span></button>
      <button class="wz-opt" data-wz="advanced">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
        <span><b>${WZ.fromNew ? 'Blank project' : 'Advanced mode'}</b><small>${advSub}</small></span></button>
    </div>
    ${WZ.fromNew ? '<button class="wz-link" data-wz="cancel">Back to my current project</button>' : '<p class="wz-note">Your work saves in this browser automatically.</p>'}
  </div>`;
}
function questionHTML(key) {
  const v = WZ.v, r = WZ.raw;
  const eyebrow = i => `<span class="eyebrow">Question ${i} of 4</span>`;
  if (key === 'size') return `${eyebrow(1)}<h2>How big is your piece of wood?</h2>
    <p class="wz-help">Measure the actual piece. Width runs left to right as you face the machine. Length runs front to back.</p>
    <div class="wz-fields">${bigField('wzW', 'Width (X)', r.w)}${bigField('wzH', 'Length (Y)', r.h)}</div>
    <div class="chips"><span class="chips-l">Common sizes</span>${[[6, 6], [12, 12], [12, 24], [24, 24], [24, 48], [48, 96]].map(s => `<button class="chip" data-size="${s[0]}x${s[1]}">${s[0]} × ${s[1]}</button>`).join('')}</div>
    <p class="wz-tip">You can type fractions like 23 3/4.</p>`;
  if (key === 'thick') return `${eyebrow(2)}<h2>How thick is the material?</h2>
    <p class="wz-help">Measure with calipers if you can. Plywood is usually a little thinner than its label: 3/4 in plywood is often about 0.71 in.</p>
    <div class="wz-fields one">${bigField('wzT', 'Thickness (Z)', r.t)}</div>
    <div class="chips"><span class="chips-l">Common thicknesses</span>${[['1/8', 0.125], ['1/4', 0.25], ['1/2', 0.5], ['3/4', 0.75], ['1', 1]].map(c => `<button class="chip" data-t="${c[1]}">${c[0]} in</button>`).join('')}</div>
    <p class="wz-tip">Not sure? Round up a little so cut-outs go all the way through.</p>`;
  if (key === 'bit') return `${eyebrow(3)}<h2>What size bit are you using?</h2>
    <p class="wz-help">Check the label on the bit holder, or measure across the cutting end.</p>
    <div class="wz-bits">${WZ_BITS.map(b => `<button class="wz-bit" data-bit="${b[0]}">${bitMini(b[0])}<b>${fracIn(b[0])} in</b><small>${b[1]}</small></button>`).join('')}</div>
    <button class="chip wz-other" data-bit="other">Other size</button>
    ${WZ.otherBit ? `<div class="wz-fields one">${bigField('wzDia', 'Bit diameter', r.dia)}</div>` : ''}
    <div class="wz-cutset" id="wzCutset"></div>`;
  if (key === 'zero') return `${eyebrow(4)}<h2>Where will you set 0,0 on the machine?</h2>
    <p class="wz-help">This is the spot you move the bit to and zero X and Y on the ShopBot before cutting.</p>
    <div class="wz-zeros">
      <button class="wz-zero" data-zero="corner">${zMini('corner')}<span><b>Front-left corner</b><small>Line the bit up with the corner closest to you on the left. Easiest to find by eye.</small></span></button>
      <button class="wz-zero" data-zero="center">${zMini('center')}<span><b>Center of the wood</b><small>Line the bit up with the middle. Draw corner-to-corner lines to find it.</small></span></button>
    </div>`;
  const ps = bitPreset(v.dia);
  return `<span class="eyebrow">All set</span><h2>Ready to design</h2>
    <dl class="wz-sum">
      <dt>Wood</dt><dd>${fmtN(v.w)} × ${fmtN(v.h)} in, ${fmtN(v.t)} in thick</dd><button data-wzgo="0">Change</button>
      <dt>Bit</dt><dd>${fracIn(v.dia)} in · ${ps.feed} in/min · ${fmtN(ps.doc)} in per pass</dd><button data-wzgo="2">Change</button>
      <dt>Zero</dt><dd>${v.zero === 'center' ? 'Center of the wood' : 'Front-left corner'}</dd><button data-wzgo="3">Change</button>
    </dl>
    <label class="fld"><span>Project name (used for the file name)</span><input class="txt big" id="wzName" value="${esc(r.name)}" placeholder="Untitled project" autocomplete="off"></label>
    <p class="wz-tip">Next: draw shapes with the tools on the left, or import an SVG or DXF.</p>`;
}
function renderWiz() {
  const c = $('#wizCard');
  if (WZ.step < 0) {
    c.innerHTML = welcomeHTML();
    const f = c.querySelector('[data-wz="guided"]'); if (f) f.focus({ preventScroll: true });
    return;
  }
  const st = WZ_STEPS[WZ.step];
  c.innerHTML = `<header class="wz-head">
      <div class="brand">${LOGO}<span>RouteReady</span></div>
      <ol class="wz-prog">${WZ_STEPS.map((s, i) => `<li class="${i < WZ.step ? 'done' : i === WZ.step ? 'cur' : ''}"><button data-wzgo="${i}"${i >= WZ.step ? ' disabled' : ''}${i === WZ.step ? ' aria-current="step"' : ''}><b>${i < WZ.step ? '✓' : i + 1}</b><span>${s.label}</span></button></li>`).join('')}</ol>
      <button class="wz-skip" data-wz="advanced">Skip to advanced mode</button>
    </header>
    <div class="wz-body">
      <figure class="wz-vis"><div id="wzVis"></div><figcaption id="wzCap"></figcaption></figure>
      <div class="wz-q">${questionHTML(st.key)}</div>
    </div>
    <footer class="wz-foot"><button class="btn" data-wz="back">Back</button><span class="wz-err" id="wzErr" role="alert"></span><button class="btn-primary" data-wz="next" id="wzNext">${st.key === 'ready' ? 'Start designing' : 'Next'}</button></footer>`;
  updateWiz();
  const f = c.querySelector('.wz-q input') || c.querySelector('.wz-q [aria-pressed="true"]') || $('#wzNext');
  if (f) f.focus({ preventScroll: true });
}
function wzValidate(key) {
  const v = WZ.v;
  if (key === 'size') {
    if (!(v.w > 0) || !(v.h > 0)) return { err: 'Enter the width and length in inches.' };
    if (v.w < 0.5 || v.h < 0.5) return { err: 'The wood needs to be at least 1/2 in on each side.' };
    if (v.w > 120 || v.h > 120) return { err: 'That is bigger than a ShopBot bed. Check that the numbers are in inches.' };
  }
  if (key === 'thick') {
    if (!(v.t > 0)) return { err: 'Enter the thickness in inches.' };
    if (v.t > 3) return { err: 'That is thicker than the machine can cut. Check that it is in inches.' };
    if (v.t > 1.5) return { warn: 'Thick wood: make sure your bit is long enough to reach all the way down.' };
  }
  if (key === 'bit') {
    if (!(v.dia > 0)) return { err: 'Pick a bit size, or enter one under "Other size".' };
    if (v.dia < 0.02 || v.dia > 1) return { err: 'Bit sizes are usually between 1/32 and 1/2 in. Check that it is in inches.' };
  }
  return {};
}
function updateWiz() {
  if (WZ.step < 0) return;
  const key = WZ_STEPS[WZ.step].key, v = WZ.v;
  const vis = $('#wzVis'), cap = $('#wzCap');
  if (key === 'size') { vis.innerHTML = boardSVG(v.w, v.h, { dims: true, focus: WZ.focus }); cap.textContent = 'Seen from above'; }
  else if (key === 'thick') { vis.innerHTML = thickSVG(v.t); cap.textContent = 'Seen from the side'; }
  else if (key === 'bit') { vis.innerHTML = bitSVG(v.dia); cap.textContent = 'Enlarged to show how wide the bit cuts'; }
  else { vis.innerHTML = boardSVG(v.w, v.h, { zero: v.zero }); cap.textContent = 'Seen from above. The red dot is X0, Y0.'; }
  const res = wzValidate(key);
  const e = $('#wzErr'); e.textContent = res.err || res.warn || ''; e.classList.toggle('warn', !res.err && !!res.warn);
  $('#wzNext').disabled = !!res.err;
  document.querySelectorAll('#wizCard [data-size]').forEach(b => { const [w, h] = b.dataset.size.split('x').map(Number); b.setAttribute('aria-pressed', String(Math.abs(w - v.w) < 1e-6 && Math.abs(h - v.h) < 1e-6)); });
  document.querySelectorAll('#wizCard [data-t]').forEach(b => b.setAttribute('aria-pressed', String(Math.abs(+b.dataset.t - v.t) < 1e-6)));
  document.querySelectorAll('#wizCard [data-bit]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.bit === 'other' ? WZ.otherBit : !WZ.otherBit && Math.abs(+b.dataset.bit - v.dia) < 1e-4)));
  document.querySelectorAll('#wizCard [data-zero]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.zero === v.zero)));
  const cs = $('#wzCutset');
  if (cs) {
    if (v.dia > 0) { const ps = bitPreset(v.dia); cs.innerHTML = `This bit will cut at <b>${ps.feed} in/min</b>, <b>${fmtN(ps.doc)} in</b> deep per pass. You can change this later under Bit.`; }
    else cs.textContent = 'Pick a size to see the cut settings.';
  }
}
function wzNext() {
  if (WZ.step < 0) return;
  if (wzValidate(WZ_STEPS[WZ.step].key).err) return;
  if (WZ.step === WZ_STEPS.length - 1) { finishWizard(); return; }
  WZ.step++; WZ.focus = null; renderWiz();
}
function finishWizard() {
  const v = WZ.v;
  pushUndo();
  const pr = baseProject((WZ.raw.name || '').trim() || 'Untitled project', v.w, v.h, v.t);
  pr.zero = v.zero;
  pr.bit.dia = v.dia; Object.assign(pr.bit, bitPreset(v.dia));
  pr.machine = Object.assign({}, P.machine);
  P = pr; sel.clear(); pathCache.clear();
  closeWizard(); setTool('select'); fitView(); changed();
  toast('Draw a shape with the tools on the left, or import an SVG or DXF.');
}
function wzAdvanced() {
  if (WZ.fromNew) {
    pushUndo();
    const pr = baseProject('Untitled project', P.material.w, P.material.h, P.material.t);
    pr.material.type = P.material.type; pr.zero = P.zero; pr.safeZ = P.safeZ; pr.tabsOff = P.tabsOff;
    pr.bit = Object.assign({}, P.bit); pr.machine = Object.assign({}, P.machine);
    P = pr; sel.clear(); pathCache.clear();
    closeWizard(); fitView(); changed();
  } else closeWizard();
}
const wizEl = $('#wiz');
wizEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const v = WZ.v, r = WZ.raw;
  const setInput = (id, val) => { const el = document.getElementById(id); if (el) el.value = val; };
  if (b.dataset.wz) {
    const a = b.dataset.wz;
    if (a === 'guided') { WZ.step = 0; renderWiz(); }
    else if (a === 'advanced') wzAdvanced();
    else if (a === 'cancel') closeWizard();
    else if (a === 'back') { WZ.step--; WZ.focus = null; renderWiz(); }
    else if (a === 'next') wzNext();
    return;
  }
  if (b.dataset.wzgo != null) { WZ.step = +b.dataset.wzgo; renderWiz(); return; }
  if (b.dataset.size) {
    const [w, h] = b.dataset.size.split('x').map(Number);
    v.w = w; v.h = h; r.w = String(w); r.h = String(h); setInput('wzW', r.w); setInput('wzH', r.h); updateWiz(); return;
  }
  if (b.dataset.t) { v.t = +b.dataset.t; r.t = fmtN(v.t); setInput('wzT', r.t); updateWiz(); return; }
  if (b.dataset.bit) {
    if (b.dataset.bit === 'other') { WZ.otherBit = true; renderWiz(); const f = $('#wzDia'); if (f) { f.focus(); f.select(); } return; }
    v.dia = +b.dataset.bit; r.dia = fmtN(v.dia);
    if (WZ.otherBit) { WZ.otherBit = false; renderWiz(); } else updateWiz();
    return;
  }
  if (b.dataset.zero) { v.zero = b.dataset.zero; updateWiz(); }
});
wizEl.addEventListener('input', e => {
  const map = { wzW: 'w', wzH: 'h', wzT: 't', wzDia: 'dia', wzName: 'name' };
  const k = map[e.target.id]; if (!k) return;
  WZ.raw[k] = e.target.value;
  if (k !== 'name') WZ.v[k] = parseIn(e.target.value);
  updateWiz();
});
wizEl.addEventListener('focusin', e => { const f = { wzW: 'w', wzH: 'h' }[e.target.id]; if (f && WZ.focus !== f) { WZ.focus = f; updateWiz(); } });
wizEl.addEventListener('focusout', e => { if ((e.target.id === 'wzW' || e.target.id === 'wzH') && WZ.focus) { WZ.focus = null; if (!$('#wiz').hidden && WZ.step === 0) updateWiz(); } });
wizEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); wzNext(); }
});
$('#btnNew').addEventListener('click', () => openWizard(true));

// ---------- go ----------
updateUndoBtns();
setPvMode(pvMode, true);
renderCards();
renderInspector();
runJob();
openWizard(false);
window.__rr = { get P() { return P; }, get job() { return job; }, importText: (name, text) => importFiles([new File([text], name)]), sbp: () => sbpText(currentJob()) };
})();
</script>
